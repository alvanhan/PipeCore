name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated development services
        run: cp .env.example .env
      - run: docker compose build rust-dev
      - run: docker compose up -d postgres mssql
      - name: Bootstrap test databases
        shell: bash
        run: |
          docker compose cp tests/fixtures/sql/postgres.sql postgres:/tmp/fixture.sql
          docker compose cp tests/fixtures/sql/mssql.sql mssql:/tmp/fixture.sql
          for i in $(seq 1 60); do
            if docker compose exec -T mssql bash -c '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1"'; then break; fi
            sleep 2
          done
          docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -f /tmp/fixture.sql'
          docker compose exec -T mssql bash -c '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b -i /tmp/fixture.sql'
      - run: docker compose run --rm rust-dev cargo fmt --all -- --check
      - run: docker compose run --rm rust-dev cargo clippy --locked --all-targets -- -D warnings
      - run: docker compose run --rm rust-dev cargo test --locked --all-targets -- --include-ignored --test-threads=1
      - run: docker compose run --rm rust-dev cargo build --locked --release --target x86_64-pc-windows-gnu --bin pipecore
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: target/x86_64-pc-windows-gnu/release/pipecore.exe
  windows-smoke:
    needs: linux
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-binary
      - shell: pwsh
        run: |
          $json = ./pipecore.exe version | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $json.status -ne 'SUCCESS') { throw 'Binary smoke failed' }
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
