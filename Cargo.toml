[package]
name = "pipecore"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Atomic schema-driven XLSX import, export and mutation"
default-run = "pipecore"

[dependencies]
anyhow = "1"
bytes = "1"
calamine = { version = "0.38", features = ["dates"] }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", features = ["sink"] }
native-tls = "0.2"
postgres-native-tls = "0.5"
quick-xml = "0.42"
regex = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
rust_xlsxwriter = { version = "0.103", features = ["constant_memory", "chrono"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tiberius = { version = "0.13", default-features = false, features = ["native-tls", "tds73", "chrono"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tokio-postgres = "0.7"
tokio-util = { version = "0.7", features = ["compat"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "9.8", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = true
